<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="register.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <div class="overlay">

            <h1>Join Our Anime Community</h1>

            <p>
                Create your free account and discover thousands of anime,
                personalized recommendations and much more.
            </p>

        </div>

    </div>

    <!-- Right Side -->

    <div class="right">

        <form id="registerForm">

            <h1>Create Account</h1>

            <!-- Full Name -->

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Full Name"
                    required
                >

            </div>

            <!-- Email -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

            </div>

            <!-- Username -->

            <div class="input-box">

                <i class="fa-solid fa-user-tag"></i>

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

            </div>

            <!-- Password -->

            <div class="input-box password-box">

                <i class="fa-solid fa-lock left-icon"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <i
                    class="fa-solid fa-eye eye-icon"
                    id="togglePassword">
                </i>

            </div>

            <!-- Confirm Password -->

            <div class="input-box password-box">

                <i class="fa-solid fa-lock left-icon"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >

                <i
                    class="fa-solid fa-eye eye-icon"
                    id="toggleConfirm">
                </i>

            </div>

            <!-- Terms -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the Terms & Conditions
                </span>

            </div>

            <!-- Message -->

            <p id="message"></p>

            <button type="submit">
                Create Account
            </button>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </form>

    </div>

</div>

<script src="register.js"></script>

</body>

</htm
