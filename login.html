<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Login Page</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- Left Section -->

        <div class="left">

            <div class="overlay">

                <h1>Anime Recommendation.</h1>

                <p>
                    Discover amazing experiences with our platform.
                </p>

                <div class="social">

                    <button type="button">
                        <i class="fab fa-facebook-f"></i>
                    </button>

                    <button type="button">
                        <i class="fab fa-twitter"></i>
                        Login with Twitter
                    </button>

                </div>

            </div>

        </div>


        <!-- Right Section -->

        <div class="right">

            <form id="loginForm">

                <h1>Login</h1>


                <!-- Username -->

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >


                <!-- Password -->

                <div class="password">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <i
                        class="fa-solid fa-eye"
                        id="eye">
                    </i>

                </div>


                <!-- Options -->

                <div class="option">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember Me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>


                <!-- Error / Success Message -->

                <p id="message"></p>


                <!-- Register -->

                <p>

                    Don't have an account?

                    <a href="Register.html">
                        Create Account
                    </a>

                </p>

            </form>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
